---
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r tests/unit/requirements.txt ansible-core
      - run: pytest -q

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - run: yamllint .

  changelog:
    name: Changelog lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install antsibull-changelog
      - run: antsibull-changelog lint

  sanity:
    name: ansible-test sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/sylve/cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - name: Run sanity tests
        run: >-
          cd ansible_collections/sylve/cloud &&
          ansible-test sanity --test validate-modules --test pep8
          --test yamllint --test import --python 3.12

  build:
    name: Collection build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - run: ansible-galaxy collection build

  integration-syntax:
    name: Integration playbook syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/sylve/cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - name: Syntax-check integration playbooks
        run: |
          cd ansible_collections/sylve/cloud
          export ANSIBLE_COLLECTIONS_PATH="${{ github.workspace }}"
          for play in tests/integration/*.yml; do
            ansible-playbook --syntax-check "$play"
          done
